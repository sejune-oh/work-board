services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: workboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - workboard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workboard"]
      interval: 5s
      retries: 10

volumes:
  workboard-db:
