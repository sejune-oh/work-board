<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>회사 선택 · 업무 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="v3.css" />
<script src="v3.js"></script>
</head>
<body data-en-title="Choose a company · Work board">
<div class="gate">
  <header class="gate-top">
    <a class="brand" href="#"><span class="brand-mark">wb</span><span data-en="Work board">업무 보드</span></a>
    <div class="gate-toggles">
      <div class="seg" role="group" aria-label="언어" data-en-label="Language">
        <button data-set-lang="ko"><span class="long">한국어</span><span class="short mono">KO</span></button>
        <button data-set-lang="en"><span class="long">English</span><span class="short mono">EN</span></button>
      </div>
      <div class="seg" role="group" aria-label="밝기" data-en-label="Theme">
        <button data-set-theme="light" aria-label="밝게" data-en-label="Light"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg></button>
        <button data-set-theme="dark" aria-label="어둡게" data-en-label="Dark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7Z"/></svg></button>
      </div>
    </div>
  </header>

  <main class="gate-main">
    <div class="gate-col reveal">
      <p class="kicker" data-en="Company">회사 확인</p>
      <h1 class="t-display" tabindex="-1" data-en="Which company do you want to open?">어느 회사로 볼지 고르세요</h1>
      <p class="t-body lead" data-en="This account belongs to more than one company. We'll remember your choice next time.">이 계정은 여러 회사에 속해 있습니다. 고른 회사는 다음에도 기억합니다.</p>

      <nav class="gate-card picker" style="padding: 8px" aria-label="회사" data-en-label="Companies">
        <a class="pick" href="#">
          <span class="org">ac</span>
          <span><span class="name" style="display:block">Acme Lab</span><span class="sub" data-en="12 people · Admin · last opened today">12명 · 관리자 · 오늘 열어 봄</span></span>
          <svg class="go" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
        </a>
        <a class="pick" href="#">
          <span class="org">be</span>
          <span><span class="name" style="display:block">Beta Works</span><span class="sub" data-en="4 people · Member">4명 · 팀원</span></span>
          <svg class="go" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
        </a>
      </nav>

      <p class="gate-foot"><span data-en="Signed in as <span class='mono'>octo-dev</span>"><span class="mono">octo-dev</span> 계정으로 로그인함</span> · <a class="link" href="#" data-en="Sign out">로그아웃</a> · <a class="link" href="#" data-en="Create a new company">새 회사 만들기</a></p>
    </div>
  </main>
  <footer class="gate-bottom"><span data-en="For a team of about ten">10명 안팎의 팀을 위한 업무 보드</span></footer>
</div>
</body>
</html>
